# MyJarvis 开源仓 CI：独立构建与测试是开源仓的硬性验收标准（见 `01`）。
# npm 发布不在这里：真实版本走发布流水线（NPM_TOKEN 密钥 + tag 触发），
# 0.0.0 placeholder 走本地 placeholder 流程。

dev:
  push:
    - name: ci
      docker:
        image: rust:bookworm
        volumes:
          - /root/.cargo/registry:cow
          - ./target:cow
      stages:
        - name: Rust 独立构建与测试
          jobs:
            - name: cargo-test
              script: cargo test --workspace --all-features

        - name: npm 契约面构建与测试
          jobs:
            - name: pnpm-verify
              script: |
                corepack enable
                pnpm install --frozen-lockfile
                pnpm -r build
                pnpm -r test

