[workspace]
resolver = "2"
members = [
    "projects/crates/*",
    "projects/crates/jarvis-desktop",
    "projects/crates/jarvis-mobile",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
# internal crates (open contract surface only; execution governance lives in embedding hosts)
jarvis-core = { path = "projects/crates/jarvis-core" }
jarvis-sandbox = { path = "projects/crates/jarvis-sandbox" }
jarvis-provider = { path = "projects/crates/jarvis-provider" }
jarvis-mcp = { path = "projects/crates/jarvis-mcp" }

# external
async-trait = "0.1"
napi = "3"
napi-build = "2"
napi-derive = "3"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

# WAE platform（桌面壳的 WebView 宿主与自动化 harness）；pin 远端 dev rev（工作区硬规则 11）
wae = { git = "https://github.com/doki-land/wae-framework", rev = "0401425f10ea2cf90b4790add464e604095a9a22", default-features = false, features = ["webview", "harness"] }
