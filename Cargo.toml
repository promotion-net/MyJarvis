[workspace]
resolver = "2"
members = [
    "projects/crates/*",
    "projects/packages/my-jarvis-desktop/src-tauri",
    "projects/packages/my-jarvis-mobile/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# internal crates（开源面：runtime / billing / verify 在闭源 MJ-Cloud 仓）
jarvis-core = { path = "projects/crates/jarvis-core" }
jarvis-sandbox = { path = "projects/crates/jarvis-sandbox" }
jarvis-provider = { path = "projects/crates/jarvis-provider" }
jarvis-mcp = { path = "projects/crates/jarvis-mcp" }

# external
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
napi = "3"
napi-build = "2"
napi-derive = "3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
