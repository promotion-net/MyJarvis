[workspace]
resolver = "2"
members = [
    "projects/crates/*",
    "projects/packages/my-jarvis-desktop/src-tauri",
    "projects/packages/my-jarvis-mobile/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
# internal crates (open contract surface only; execution governance lives in embedding hosts)
jarvis-core = { path = "projects/crates/jarvis-core" }
jarvis-sandbox = { path = "projects/crates/jarvis-sandbox" }
jarvis-provider = { path = "projects/crates/jarvis-provider" }
jarvis-mcp = { path = "projects/crates/jarvis-mcp" }

# external
async-trait = "0.1"
napi = "3"
napi-build = "2"
napi-derive = "3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
tauri-build = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
